<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>妖怪1504 - CPU対戦</title>
<style>
:root{
  --teal:#312a52;
  --teal-dark:#1d1836;
  --teal-darker:#100d20;
  --cream:#f3e7ce;
  --gold:#d7a83c;
  --red:#a53c3c;
  --ink:#2a2320;
  --ghost:#7fd8b8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{
  margin:0; padding:0; height:100%; width:100%;
  background:var(--teal-darker);
  font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--ink);
  overscroll-behavior:none;
}
#app{
  max-width:480px; margin:0 auto; min-height:100vh;
  background:
    radial-gradient(circle at 15% 12%, rgba(127,216,184,.16) 0%, rgba(127,216,184,0) 32%),
    radial-gradient(circle at 85% 30%, rgba(215,168,60,.14) 0%, rgba(215,168,60,0) 30%),
    radial-gradient(circle at 30% 80%, rgba(165,60,60,.14) 0%, rgba(165,60,60,0) 34%),
    linear-gradient(180deg,var(--teal) 0%, var(--teal-dark) 55%, var(--teal-darker) 100%);
  display:flex; flex-direction:column;
  position:relative;
  overflow:hidden;
}
.hidden{display:none !important;}

/* ---------- SETUP SCREEN ---------- */
#setupScreen{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:24px 20px; text-align:center; gap:14px;
}
#setupScreen h1{
  font-size:38px; color:var(--cream); margin:0; letter-spacing:2px;
  text-shadow:2px 2px 0 var(--teal-darker), 0 0 20px rgba(127,216,184,.55);
}
#setupScreen .sub{ color:var(--cream); font-size:13px; opacity:.9; margin-bottom:6px;}
.badge-row{ display:flex; gap:8px; margin:6px 0 14px;}
.badge{
  background:rgba(255,255,255,.15); color:var(--cream); font-size:11px;
  padding:6px 10px; border-radius:20px; border:1px solid rgba(255,255,255,.35);
}
.bigbtn{
  background:var(--gold); color:#3a2500; border:none; border-radius:14px;
  padding:16px 36px; font-size:18px; font-weight:bold; letter-spacing:2px;
  box-shadow:0 4px 0 #a87421, 0 6px 10px rgba(0,0,0,.3);
  cursor:pointer; touch-action:manipulation;
}
.bigbtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #a87421;}
.linkbtn{
  background:none; border:none; color:var(--cream); text-decoration:underline;
  font-size:13px; opacity:.85; padding:8px; cursor:pointer;
}
#ruleBox{
  background:rgba(255,255,255,.92); border-radius:12px; padding:14px 16px;
  text-align:left; font-size:12.5px; line-height:1.7; max-height:60vh; overflow-y:auto;
  margin-top:6px; box-shadow:0 4px 12px rgba(0,0,0,.25);
}
#ruleBox h3{ margin:10px 0 4px; font-size:14px; color:var(--teal-dark);}
#ruleBox h3:first-child{margin-top:0;}
#soundToggleRow{ display:flex; align-items:center; gap:8px; color:var(--cream); font-size:12px; margin-top:2px;}

/* ---------- DICE SCREEN ---------- */
#diceScreen{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:24px 20px; text-align:center; gap:10px;
}
#diceScreen h2{ color:var(--cream); font-size:22px; margin:0 0 2px; letter-spacing:1px;}
#diceScreen .sub{ color:var(--cream); font-size:12.5px; opacity:.85; margin-bottom:8px;}
.dice-row{ display:flex; align-items:center; justify-content:center; gap:20px; margin:10px 0 6px;}
.dice-col{ display:flex; flex-direction:column; align-items:center; gap:6px;}
.dice-vs{ color:var(--gold); font-weight:bold; font-size:14px; letter-spacing:1px;}
.dice-label{ color:var(--cream); font-size:11.5px; opacity:.9;}
.dice{
  width:64px; height:64px; border-radius:12px; display:grid;
  grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  padding:9px; box-shadow:0 4px 10px rgba(0,0,0,.45);
}
.dice.white{ background:#f3e7ce; border:2px solid #3a332b;}
.dice.black{ background:#1a1626; border:2px solid #000;}
.dice .pip{ width:9px; height:9px; border-radius:50%; margin:auto;}
.dice.white .pip{ background:#2a2320;}
.dice.black .pip{ background:#f3e7ce;}
.dice.rolling{ animation: diceShake .12s infinite; }
@keyframes diceShake{ 0%{transform:rotate(0deg);} 25%{transform:rotate(-9deg);} 75%{transform:rotate(9deg);} 100%{transform:rotate(0deg);} }
.dice-result{ color:var(--cream); font-size:14px; font-weight:bold; min-height:20px; margin:6px 0 4px;}

/* ---------- BOARD SCREEN ---------- */
#boardScreen{ display:flex; flex-direction:column; height:100vh; padding-bottom:env(safe-area-inset-bottom); overflow-y:auto;}
#topBar{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 10px; background:var(--teal-darker); color:var(--cream);
  font-size:11px;
}
#topBar .title{ font-weight:bold; letter-spacing:2px; font-size:13px;}
#topBar .lifebox{ display:flex; align-items:center; gap:4px;}
.pool-wrap{ display:flex; flex-direction:column; align-items:center; gap:3px; flex-shrink:0;}
.lifemini{
  display:flex; align-items:center; gap:3px; color:#fff; font-size:11px; font-weight:bold;
  background:rgba(0,0,0,.3); padding:2px 7px; border-radius:10px; border:1px solid rgba(255,255,255,.25);
  white-space:nowrap;
}
#topBar .btns{ display:flex; gap:6px;}
.iconbtn{ background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4); color:var(--cream); border-radius:50%; width:24px;height:24px; font-size:12px; line-height:1;}

.zone{ padding:2px 8px; }
.oppzone{ padding-top:6px;}
.rowline{ display:flex; align-items:center; justify-content:center; gap:5px; }
.pile{
  width:34px; height:50px; border-radius:5px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:9px; color:var(--cream); background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.3);
  flex-shrink:0;
}
.pile .n{ font-size:13px; font-weight:bold; }
.deckgrave-stack{ display:flex; flex-direction:column; gap:3px; flex-shrink:0; }
.pile.mini2{ width:34px; height:29px; font-size:7.5px; }
.pile.mini2 .n{ font-size:11px; }
.fieldslots{ display:flex; gap:5px; }
.slot{
  width:62px; height:92px; border-radius:8px; border:2px dashed rgba(255,255,255,.35);
  display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0;
  background:rgba(255,255,255,.06); touch-action:none;
}
.card{
  width:100%; height:100%; border-radius:7px; background:var(--cream) center top/cover no-repeat;
  border:2px solid var(--teal-darker); position:relative; overflow:hidden;
  box-shadow:0 2px 5px rgba(0,0,0,.35);
  animation:pop .18s ease-out;
}
@keyframes pop{ from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1;} }
.card .cardShade{ position:absolute; left:0; right:0; bottom:0; height:38%; background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.72));}
.card .cfoot{ position:absolute; left:3px; right:3px; bottom:2px; display:flex; justify-content:space-between; align-items:center; }
.card .catk{ background:var(--red); color:#fff; border-radius:4px; padding:1px 5px; font-weight:bold; font-size:11px;}
.card .chd{ display:flex; gap:1px; }
.dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.35); border:1px solid rgba(255,255,255,.6);}
.dot.filled{ background:var(--gold); border-color:#a87421;}
.facedown{
  width:100%; height:100%; border-radius:7px;
  background:repeating-linear-gradient(45deg,var(--red),var(--red) 5px,var(--teal-darker) 5px,var(--teal-darker) 10px);
  border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; color:var(--cream); font-size:16px;
}
.slot.selectable .card, .slot.selectable .facedown{ box-shadow:0 0 0 3px var(--ghost), 0 0 12px 3px var(--ghost); }
.slot.selectable{ animation:glow 1s infinite alternate; }
.slot.picked-target .card{ box-shadow:0 0 0 3px var(--red), 0 0 14px 3px var(--red); }
@keyframes glow{ from{ filter:drop-shadow(0 0 2px var(--ghost)); } to{ filter:drop-shadow(0 0 9px var(--ghost)); } }
.slot.dropready{ border-color:var(--ghost); background:rgba(127,216,184,.22); }
.slot.atk-ready .card{ box-shadow:0 0 0 2px rgba(165,60,60,.85); }
.slot.atk-ready{ animation: atkGlow 1.4s infinite alternate; }
@keyframes atkGlow{ from{ filter:drop-shadow(0 0 1px rgba(165,60,60,.5)); } to{ filter:drop-shadow(0 0 6px rgba(165,60,60,.85)); } }
.setpile{ width:38px; height:56px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-left:2px;}
.setpile .slot.mini{ width:36px; height:54px; border-radius:6px; }
.setzone-hint{ font-size:7px; color:rgba(255,255,255,.8); text-align:center; line-height:1.2;}
.setpile-wrap{ display:flex; flex-direction:column; align-items:center; gap:4px; margin-left:2px; flex-shrink:0;}

#centerZone{ display:flex; flex-direction:column; padding:2px 10px; min-height:0;}
.pooltoken{
  width:48px; height:58px; background:radial-gradient(circle,rgba(127,216,184,.3),rgba(127,216,184,.08));
  border:2px dashed var(--ghost); position:relative;
  border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#fff; font-size:22px; touch-action:none; filter:drop-shadow(0 0 5px rgba(127,216,184,.6));
  flex-shrink:0;
}
.pooltoken.small{ width:38px; height:46px; font-size:17px; filter:none; opacity:.8; touch-action:auto; }
.poolcount{
  position:absolute; right:-4px; bottom:-4px; background:var(--gold); color:#3a2500;
  font-size:10px; font-weight:bold; border-radius:50%; min-width:16px; height:16px; padding:0 2px;
  display:flex; align-items:center; justify-content:center; border:1.5px solid var(--teal-darker);
  line-height:1;
}
.pooltoken.small .poolcount{ font-size:8.5px; min-width:13px; height:13px; right:-3px; bottom:-3px;}
#logArea{
  flex:1; min-height:36px; max-height:62px; overflow-y:auto; background:rgba(0,0,0,.18);
  border-radius:8px; padding:5px 8px; font-size:10.5px; color:var(--cream); line-height:1.5;
  margin:4px 0;
}
#logArea div{ opacity:.85; }
#logArea div:last-child{ opacity:1; font-weight:bold; color:#fff; }

#phaseControls{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; align-items:center; padding:4px 0 6px;}
.ctrlbtn{
  background:var(--cream); color:var(--teal-darker); border:none; border-radius:20px;
  padding:9px 14px; font-size:12.5px; font-weight:bold; box-shadow:0 2px 0 rgba(0,0,0,.25);
}
.ctrlbtn.secondary{ background:rgba(255,255,255,.25); color:var(--cream); border:1px solid rgba(255,255,255,.5); }
.ctrlbtn.attack{ background:var(--red); color:#fff; }
.ctrlbtn:active{ transform:translateY(2px); box-shadow:none;}
.ctrlbtn:disabled{ opacity:.4; }
.endbtn{
  width:36px; height:36px; border-radius:50%; padding:0; flex-shrink:0;
  background:var(--red); color:#fff; border:2px solid rgba(255,255,255,.5);
  font-size:9.5px; font-weight:bold; letter-spacing:0.5px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 0 rgba(0,0,0,.35), 0 3px 8px rgba(0,0,0,.3);
}
.endbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.35);}
#phaseLabel{ text-align:center; color:var(--cream); font-size:11px; letter-spacing:1px; opacity:.9; padding-top:2px;}

.playerzone{ padding-bottom:6px;}
#handRow{
  display:flex; gap:6px; overflow-x:auto; padding:5px 8px 8px; min-height:98px;
  -webkit-overflow-scrolling:touch;
}
.handcard{ width:64px; height:95px; flex-shrink:0; touch-action:none; }

/* Bottom sheet */
#sheetOverlay{
  position:absolute; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:50;
}
#sheet{
  width:100%; background:var(--cream); border-radius:16px 16px 0 0; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  animation:slideup .18s ease-out; max-height:70vh; overflow-y:auto;
}
@keyframes slideup{ from{transform:translateY(100%);} to{transform:translateY(0);} }
#sheet .shead{ display:flex; align-items:center; gap:10px; margin-bottom:8px;}
#sheet .sicon{ width:46px; height:68px; border-radius:6px; background:#fff center/cover no-repeat; border:2px solid var(--teal-darker); flex-shrink:0;}
#sheet .sname{ font-size:15px; font-weight:bold; }
#sheet .sdesc{ font-size:11.5px; color:#555; margin-top:2px; line-height:1.5;}
#sheet .sstats{ font-size:11px; color:var(--teal-dark); margin-top:2px;}
#sheet .sbtns{ display:flex; flex-direction:column; gap:8px; margin-top:12px;}
#sheet button{ padding:12px; border-radius:10px; border:none; font-size:14px; font-weight:bold; text-align:center; }
#sheet .primary{ background:var(--teal); color:#fff; }
#sheet .primary2{ background:var(--gold); color:#3a2500; }
#sheet .cancel{ background:#e2ded1; color:#555; }
#sheet button:disabled{ opacity:.35; }

#toast{
  position:absolute; top:44%; left:50%; transform:translate(-50%,-50%);
  background:rgba(0,0,0,.78); color:#fff; padding:14px 20px; border-radius:12px;
  font-size:13.5px; z-index:80; text-align:center; max-width:80%; pointer-events:none;
}

#detailOverlay{
  position:absolute; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:60; padding:20px;
}
#detailCard{ text-align:center; width:100%; max-width:280px;}
#detailCard .dstats{ background:rgba(0,0,0,.55); color:#fff; font-size:12.5px; font-weight:bold; padding:6px 10px; border-radius:8px; margin-top:8px;}
#detailCard button{ margin-top:12px; background:var(--cream); color:var(--teal-darker); border:none; border-radius:10px; padding:10px 22px; font-size:13px; font-weight:bold;}

#trapPromptOverlay{ position:absolute; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:70; padding:20px;}
#trapPrompt{ background:var(--cream); border-radius:14px; padding:18px; width:100%; max-width:300px; text-align:center;}
#trapPrompt h3{ margin:2px 0 8px; font-size:15px; color:var(--red);}
#trapPrompt p{ font-size:12.5px; color:#444; line-height:1.6;}
#trapPrompt .tbtns{ display:flex; gap:8px; margin-top:14px;}
#trapPrompt button{ flex:1; padding:11px; border-radius:10px; border:none; font-weight:bold; font-size:13px;}
#trapPrompt .yes{ background:var(--red); color:#fff;}
#trapPrompt .no{ background:#e2ded1; color:#555;}
#confirmOverlay{ position:absolute; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:75; padding:20px;}
#confirmBox{ background:var(--cream); border-radius:14px; padding:18px; width:100%; max-width:280px; text-align:center;}
#confirmBox p{ font-size:13px; color:#333; line-height:1.6; margin:0 0 14px;}
#confirmBox .tbtns{ display:flex; gap:8px;}
#confirmBox button{ flex:1; padding:11px; border-radius:10px; border:none; font-weight:bold; font-size:13px;}
#confirmBox .yes{ background:var(--red); color:#fff;}
#confirmBox .no{ background:#e2ded1; color:#555;}

/* Result */
#resultScreen{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:24px; text-align:center; gap:16px;
}
#resultScreen h1{ font-size:32px; color:var(--cream); text-shadow:2px 2px 0 rgba(0,0,0,.3);}
#resultScreen .resSub{ color:var(--cream); font-size:13px; opacity:.9;}

#turnBanner{
  position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center;
  pointer-events:none; z-index:90;
}
#turnBanner .txt{
  font-size:26px; font-weight:bold; color:var(--cream); letter-spacing:4px;
  text-shadow:0 0 14px rgba(0,0,0,.5), 2px 2px 0 var(--teal-darker);
  background:rgba(0,0,0,.25); padding:10px 26px; border-radius:10px;
  animation:bannerIn .5s ease-out;
}
@keyframes bannerIn{ 0%{opacity:0; transform:scale(1.3);} 15%{opacity:1; transform:scale(1);} 80%{opacity:1;} 100%{opacity:0;} }
</style>
</head>
<body>
<div id="app">

  <!-- ===== SETUP ===== -->
  <div id="setupScreen">
    <div class="badge-row">
      <span class="badge">2人用対戦カードゲーム</span>
      <span class="badge">CPU対戦</span>
    </div>
    <h1>妖怪1504</h1>
    <div class="sub">あの頃のTCGを10分で。</div>
    <button class="bigbtn" id="startBtn">ゲームをはじめる</button>
    <button class="linkbtn" id="showRuleBtn">ルールを見る</button>
    <div id="soundToggleRow"><input type="checkbox" id="soundToggle" checked><label for="soundToggle">効果音ON</label></div>
    <div id="ruleBox" class="hidden"></div>
  </div>

  <!-- ===== DICE ROLL ===== -->
  <div id="diceScreen" class="hidden">
    <h2>先攻を決めよう</h2>
    <div class="sub">サイコロを転がして、大きい目を出した方が先攻！</div>
    <div class="dice-row">
      <div class="dice-col">
        <div class="dice white" id="diceWhite"></div>
        <div class="dice-label">あなた（白）</div>
      </div>
      <div class="dice-vs">VS</div>
      <div class="dice-col">
        <div class="dice black" id="diceBlack"></div>
        <div class="dice-label">CPU（黒）</div>
      </div>
    </div>
    <div id="diceResultText" class="dice-result">準備はいい？</div>
    <button class="bigbtn" id="diceRollBtn">サイコロを振る</button>
    <button class="bigbtn hidden" id="diceGoBtn">対戦スタート</button>
  </div>

  <!-- ===== BOARD ===== -->
  <div id="boardScreen" class="hidden">
    <div id="topBar">
      <button class="iconbtn" id="homeBtn">🏠</button>
      <div class="title">妖怪1504</div>
      <div class="btns"><button class="iconbtn" id="soundBtn">🔊</button><button class="iconbtn" id="helpBtn">?</button></div>
    </div>

    <div class="zone oppzone" data-dropzone="oppfield">
      <div class="rowline" id="oppHandRow"></div>
      <div class="rowline">
        <div class="pool-wrap">
          <div class="lifemini">❤️<b id="oppLifeNum">15</b></div>
          <div class="pooltoken small" id="hitodamaPoolTokenOpp">👻<span class="poolcount" id="stockNumOpp">0</span></div>
        </div>
        <div class="fieldslots" id="oppField"></div>
        <div class="deckgrave-stack">
          <div class="pile mini2" id="oppDeckPile"><div>山</div><div class="n">0</div></div>
          <div class="pile mini2" id="oppGravePile"><div>墓</div><div class="n">0</div></div>
        </div>
        <div class="setpile" id="oppSetSpellSlot"></div>
      </div>
    </div>

    <div id="centerZone">
      <div id="logArea"></div>
      <div id="phaseLabel">-</div>
      <div id="phaseControls"></div>
    </div>

    <div class="zone playerzone">
      <div class="rowline">
        <div class="pool-wrap">
          <div class="lifemini">❤️<b id="selfLifeNum">15</b></div>
          <div class="pooltoken" id="hitodamaPoolToken">👻<span class="poolcount" id="stockNum">0</span></div>
        </div>
        <div class="fieldslots" id="playerField"></div>
        <div class="deckgrave-stack">
          <div class="pile mini2" id="playerDeckPile"><div>山</div><div class="n">0</div></div>
          <div class="pile mini2" id="playerGravePile"><div>墓</div><div class="n">0</div></div>
        </div>
        <div class="setpile-wrap">
          <div class="setpile" id="playerSetSpellSlot"></div>
          <button class="endbtn hidden" id="endTurnBtn">END</button>
        </div>
      </div>
      <div id="handRow"></div>
    </div>

    <div id="turnBanner" class="hidden"><div class="txt" id="turnBannerTxt">YOUR TURN</div></div>
  </div>

  <!-- ===== RESULT ===== -->
  <div id="resultScreen" class="hidden">
    <h1 id="resultTitle">WIN</h1>
    <div class="resSub" id="resultSub"></div>
    <button class="bigbtn" id="retryBtn">もう一度あそぶ</button>
  </div>

  <!-- ===== overlays ===== -->
  <div id="sheetOverlay" class="hidden">
    <div id="sheet"></div>
  </div>
  <div id="detailOverlay" class="hidden">
    <div id="detailCard"></div>
  </div>
  <div id="trapPromptOverlay" class="hidden">
    <div id="trapPrompt"></div>
  </div>
  <div id="confirmOverlay" class="hidden">
    <div id="confirmBox"></div>
  </div>
  <div id="toast" class="hidden"></div>

let actx = null;
function getCtx(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(actx && actx.state==='suspended'){ actx.resume(); }
  return actx;
}
function tone(freq, dur, type, vol, startOffset){
  if(!soundOn) return;
  const ctx = getCtx(); if(!ctx) return;
  const t0 = ctx.currentTime + (startOffset||0);
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type = type||'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol||0.2, t0+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sweep(f1,f2,dur,type,vol,startOffset){
  if(!soundOn) return;
  const ctx = getCtx(); if(!ctx) return;
  const t0 = ctx.currentTime + (startOffset||0);
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type = type||'sawtooth';
  osc.frequency.setValueAtTime(f1,t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol||0.2,t0+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}

/* =========================================================

let cardUidCounter = 0;
function makeCard(def, kind){
  return {
    uid:'c'+(cardUidCounter++), defId:def.id, name:def.name, kind,
    baseAtk: def.atk||0, cap: def.cap||0, type: def.type||'none',
    desc: def.desc, effectKey: def.effectKey||null,
    hitodama:0, tempBuff:0, tempBuffTurn:0, tempDebuff:0, tempDebuffTurn:0,
    cursedUntilTurn:0
  };
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function buildDeck(){
  const arr = [];
  YOKAI.forEach(d=>arr.push(makeCard(d,'yokai')));
  SPELLS.forEach(d=>arr.push(makeCard(d,'spell')));
  return shuffle(arr);
}
function freshPlayer(){
  return {life:15, deck:buildDeck(), hand:[], field:[null,null,null], setSpell:null, graveyard:[], attackLockUntilTurn:0};
}

let state = null;

function newGame(forcedFirst){
  cardUidCounter = 0;
  state = {
    turn:1, active:'player', phase:'main', actionCount:0, attacked:false,
    hitodamaStock:11, negatedAttack:false, gameOver:false, pendingAttacker:null,
    awaitingCpuTurnEndAfterAttack:false,
    players:{ player:freshPlayer(), cpu:freshPlayer() },
    log:[], selection:null
  };
  for(let i=0;i<4;i++){
    state.players.player.hand.push(state.players.player.deck.pop());
    state.players.cpu.hand.push(state.players.cpu.deck.pop());
  }
  state.active = (forcedFirst==='player'||forcedFirst==='cpu') ? forcedFirst : (Math.random()<0.5 ? 'player' : 'cpu');
  log(state.active==='player' ? 'サイコロに勝った！ あなたが先攻です。' : 'サイコロに負けた…CPUが先攻です。');
  document.getElementById('diceScreen').classList.add('hidden');
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('boardScreen').classList.remove('hidden');
  render();
  showTurnBanner();
  startTurn();
}

function log(msg){
  state.log.push(msg);
  if(state.log.length>60) state.log.shift();
  const el = document.getElementById('logArea');
  el.innerHTML = state.log.slice(-8).map(m=>`<div>${m}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}

/* ---------- ヘルパー ---------- */
function nameOf(key){ return key==='player' ? 'あなた' : 'CPU'; }
function oppKeyOf(key){ return key==='player' ? 'cpu' : 'player'; }
function ownerOfCard(card){
  for(const k of ['player','cpu']){
    if(state.players[k].field.some(c=>c && c.uid===card.uid)) return k;
  }
  return null;
}
function countAliveField(key){ return state.players[key].field.filter(c=>c).length; }
function isCardAlive(card){
  return ['player','cpu'].some(k=>state.players[k].field.some(c=>c && c.uid===card.uid));
}
function isProtected(card){ return card.defId==='zashiki' && card.hitodama>=1; }
function baseEffAtk(card){
  let a = card.baseAtk + card.hitodama;
  if(card.defId==='kappa') a += card.hitodama;
  if(card.tempBuffTurn===state.turn) a += card.tempBuff;
  if(card.tempDebuffTurn===state.turn) a -= card.tempDebuff;
  return Math.max(0, a);
}
function atkBreakdown(card){
  const total = baseEffAtk(card);
  if(card.hitodama<=0) return `${total}`;
  if(card.defId==='kappa') return `${total}＝基礎${card.baseAtk}+ヒトダマ${card.hitodama}×2`;
  return `${total}＝基礎${card.baseAtk}+ヒトダマ${card.hitodama}`;
}
function drawOne(key){
  const p = state.players[key];
  if(p.deck.length>0){ p.hand.push(p.deck.pop()); }
}
function destroyCard(card, ownerKey){
  const p = state.players[ownerKey];
  state.hitodamaStock += card.hitodama;
  card.hitodama = 0; card.tempBuff=0; card.tempDebuff=0; card.cursedUntilTurn=0;
  const idx = p.field.findIndex(c=>c && c.uid===card.uid);
  if(idx>=0) p.field[idx]=null;
  p.graveyard.push(card);
  playSfx('destroy');
}
function dealDamage(key, amount){
  const p = state.players[key];
  const dmg = Math.max(0, amount);
  p.life = Math.max(0, p.life - dmg);
  playSfx('damage');
  log(`${nameOf(key)}は${dmg}ダメージを受けた。（残りライフ ${p.life}）`);
  render();
  if(p.life<=0 && !state.gameOver){ endGame(oppKeyOf(key)); }
  return dmg;
}

/* =========================================================
   効果解決
   ========================================================= */
function applyEffect(effectKey, casterKey, target, sourceCard){
  const oppKey = oppKeyOf(casterKey);
  target = target || {};
  switch(effectKey){
    case 'destroySetSpell': {
      if(!target.setSpellOwner){ log('対象がなく、効果は不発だった。'); toast('セットされたスペルが無く、不発だった'); break; }
      const owner = target.setSpellOwner;
      const spell = state.players[owner].setSpell;
      if(spell){
        log(`「${sourceCard.name}」の効果で、セットされていた「${spell.name}」が破壊された！`);
        state.players[owner].graveyard.push(spell);
        state.players[owner].setSpell = null;
      } else {
        log('対象がなく、効果は不発だった。');
        toast('セットされたスペルが無く、不発だった');
      }
      break;
    }
    case 'swapControl': {
      if(!target.card){ log('対象がなく、効果は不発だった。'); toast('相手の場に妖怪がいないため、不発だった'); break; }
      const casterField = state.players[casterKey].field;
      const nekomataIdx = casterField.findIndex(c=>c && c.uid===sourceCard.uid);
      const oppField = state.players[target.ownerKey].field;
      const targetIdx = oppField.findIndex(c=>c && c.uid===target.card.uid);
      if(nekomataIdx<0 || targetIdx<0){ log('対象がいなくなっており、効果は不発だった。'); toast('対象がいなくなっており、不発だった'); break; }
      const tgt = target.card;
      casterField[nekomataIdx] = tgt;
      oppField[targetIdx] = sourceCard;
      log(`「猫又」の解放効果！ ${tgt.name}とコントロールを入れ替えた。`);
      break;
    }
    case 'draw2':
      drawOne(casterKey); drawOne(casterKey);
      log(`${nameOf(casterKey)}は「小槌」でカードを2枚引いた。`);
      break;
    case 'destroyChargedUpTo2': {
      if(!target.cards || !target.cards.length){ log('対象がなく、効果は不発だった。'); toast('ヒトダマが置かれた妖怪がおらず、不発だった'); break; }
      target.cards.forEach(t=>{
        if(isCardAlive(t.card)){
          log(`「呪符」で${t.card.name}を破壊した！`);
          destroyCard(t.card, t.key);
        }
      });
      break;
    }
    case 'reviveFromEitherGrave': {
      if(!target.card){
        log('対象がなく、効果は不発だった。');
        toast(countAliveField(casterKey)>=3 ? '自分の場がいっぱいで、不発だった' : '墓地に妖怪がおらず、不発だった');
        break;
      }
      if(countAliveField(casterKey)>=3){ log('場がいっぱいで、呼び戻せなかった。'); toast('自分の場がいっぱいで、不発だった'); break; }
      const gy = state.players[target.from].graveyard;
      const idx = gy.findIndex(c=>c.uid===target.card.uid);
      if(idx<0){ log('対象が既になく、効果は不発だった。'); toast('対象が既になく、不発だった'); break; }
      const [c] = gy.splice(idx,1);
      c.hitodama=0; c.tempBuff=0; c.tempDebuff=0; c.cursedUntilTurn=0;
      const slot = state.players[casterKey].field.findIndex(f=>!f);
      state.players[casterKey].field[slot] = c;
      playSfx('play');
      log(`「墓石」で${c.name}を場に呼び戻した。`);
      toast(`「墓石」で${c.name}を蘇生した！`);
      break;
    }
    case 'moveHitodama': {
      if(!target.from || !target.to){ log('対象がなく、効果は不発だった。'); toast('移動できるヒトダマが無く、不発だった'); break; }
      const fromCard = target.from.card, toCard = target.to.card;
      if(fromCard.hitodama<1 || toCard.cap<=toCard.hitodama){ log('移動できず、効果は不発だった。'); toast('移動先に空きが無く、不発だった'); break; }
      fromCard.hitodama--; toCard.hitodama++;
      playSfx('hitodama');
      log(`「扇」で${fromCard.name}のヒトダマを${toCard.name}に移した。`);
      break;
    }
    case 'destroyHighestAtk': {
      if(!target.card){ log('対象がなく、効果は不発だった。'); toast('場に妖怪がおらず、不発だった'); break; }
      log(`「破魔矢」で${target.card.name}を破壊した！`);
      destroyCard(target.card, target.ownerKey);
      break;
    }
    case 'freeHitodama3':
      // 配置は resolveTargetThen 側で即時処理済み
      break;
    default: break;
  }
}

/* ---- ターゲット解決（人間はUI、CPUは自動） ---- */
function resolveTargetThen(effectKey, casterKey, isSpell, callback, onCancel){
  const oppKey = oppKeyOf(casterKey);
  switch(effectKey){
    case 'destroySetSpell': {
      const opts = [];
      if(state.players.player.setSpell) opts.push({key:'player'});
      if(state.players.cpu.setSpell) opts.push({key:'cpu'});
      if(opts.length===0){ callback(null); return; }
      if(casterKey==='cpu'){
        const pick = opts.find(o=>o.key==='player') || opts[0];
        callback({setSpellOwner:pick.key}); return;
      }
      if(opts.length===1){ callback({setSpellOwner:opts[0].key}); return; }
      beginSetSpellSelection(opts, callback, onCancel); return;
    }
    case 'swapControl': {
      const list = state.players[oppKey].field.map((c,i)=>c?{key:oppKey,idx:i,card:c}:null).filter(x=>x);
      if(list.length===0){ callback(null); return; }
      if(casterKey==='cpu'){
        const best = list.reduce((a,b)=> baseEffAtk(b.card)>baseEffAtk(a.card)?b:a);
        callback({type:'yokai', card:best.card, ownerKey:oppKey}); return;
      }
      beginFieldSelection(list, (picked)=>{ callback(picked?{type:'yokai',card:picked.card,ownerKey:picked.key}:null); }, onCancel); return;
    }
    case 'draw2': callback(null); return;
    case 'destroyChargedUpTo2': {
      const cands = [];
      ['player','cpu'].forEach(k=>{
        state.players[k].field.forEach((c,i)=>{ if(c && c.hitodama>=1 && !(isSpell && isProtected(c))) cands.push({key:k, idx:i, card:c}); });
      });
      if(cands.length===0){ callback(null); return; }
      if(casterKey==='cpu'){
        const sorted = cands.slice().sort((a,b)=>{
          const aw = a.key===oppKey?1:0, bw = b.key===oppKey?1:0;
          if(aw!==bw) return bw-aw;
          return baseEffAtk(b.card)-baseEffAtk(a.card);
        });
        callback({cards: sorted.slice(0,2)}); return;
      }
      beginMultiSelect(cands, 2, (picked)=>{ callback(picked && picked.length ? {cards:picked}:null); }, onCancel); return;
    }
    case 'reviveFromEitherGrave': {
      const cands = [];
      state.players[casterKey].graveyard.forEach((c)=>{ if(c.kind==='yokai') cands.push({from:casterKey, card:c}); });
      state.players[oppKey].graveyard.forEach((c)=>{ if(c.kind==='yokai') cands.push({from:oppKey, card:c}); });
      if(cands.length===0 || countAliveField(casterKey)>=3){ callback(null); return; }
      if(casterKey==='cpu'){
        const best = cands.reduce((a,b)=> baseEffAtk(b.card)>baseEffAtk(a.card)?b:a);
        callback(best); return;
      }
      beginGraveyardPicker(cands, callback, onCancel); return;
    }
    case 'moveHitodama': {
      const srcCands = [];
      ['player','cpu'].forEach(k=>{ state.players[k].field.forEach((c,i)=>{ if(c && c.hitodama>=1 && !(isSpell && isProtected(c))) srcCands.push({key:k,idx:i,card:c}); }); });
      if(srcCands.length===0){ callback(null); return; }
      if(casterKey==='cpu'){
        const src = srcCands.slice().sort((a,b)=>baseEffAtk(b.card)-baseEffAtk(a.card))[0];
        const dstCands = [];
        ['player','cpu'].forEach(k=>{ state.players[k].field.forEach((c,i)=>{ if(c && c.cap>c.hitodama && c.uid!==src.card.uid && !(isSpell && isProtected(c))) dstCands.push({key:k,idx:i,card:c}); }); });
        if(dstCands.length===0){ callback(null); return; }
        const dst = dstCands.find(d=>d.key==='cpu') || dstCands[0];
        callback({from:{key:src.key,card:src.card}, to:{key:dst.key,card:dst.card}}); return;
      }
      beginFieldSelection(srcCands, (fromPick)=>{
        if(!fromPick){ callback(null); return; }
        const dstCands = [];
        ['player','cpu'].forEach(k=>{ state.players[k].field.forEach((c,i)=>{ if(c && c.cap>c.hitodama && c.uid!==fromPick.card.uid && !(isSpell && isProtected(c))) dstCands.push({key:k,idx:i,card:c}); }); });
        if(dstCands.length===0){ callback(null); return; }
        toast('移動先の妖怪を選んでください');
        beginFieldSelection(dstCands, (toPick)=>{
          if(!toPick){ callback(null); return; }
          callback({from:{key:fromPick.key,card:fromPick.card}, to:{key:toPick.key,card:toPick.card}});
        }, onCancel);
      }, onCancel);
      return;
    }
    case 'destroyHighestAtk': {
      const cands = [];
      ['player','cpu'].forEach(k=>{ state.players[k].field.forEach((c,i)=>{ if(c && !(isSpell && isProtected(c))) cands.push({key:k,idx:i,card:c}); }); });
      if(cands.length===0){ callback(null); return; }
      const maxAtk = Math.max(...cands.map(c=>baseEffAtk(c.card)));
      const tied = cands.filter(c=>baseEffAtk(c.card)===maxAtk);
      if(tied.length===1 || casterKey==='cpu'){
        const pick = casterKey==='cpu' ? (tied.find(t=>t.key===oppKey)||tied[0]) : tied[0];
        callback({type:'yokai', card:pick.card, ownerKey:pick.key}); return;
      }
      beginFieldSelection(tied, (picked)=>{ callback(picked?{type:'yokai',card:picked.card,ownerKey:picked.key}:null); }, onCancel); return;
    }
    case 'freeHitodama3': {
      if(casterKey==='cpu'){
        let remaining=3;
        while(remaining>0 && state.hitodamaStock>0){
          const cands = state.players.cpu.field.filter(c=>c && c.cap>c.hitodama);
          if(!cands.length) break;
          cands.sort((a,b)=>baseEffAtk(b)-baseEffAtk(a));
          cands[0].hitodama++; state.hitodamaStock--; remaining--;
        }
        callback(null); return;
      }
      beginDistribute(casterKey, 3, isSpell, ()=>callback(null), onCancel); return;
    }
    default: callback(null); return;
  }
}

/* =========================================================
   共通アクション（プレイ／セット／発動）
   ========================================================= */
function castSpellNow(casterKey, idx){
  const hand = state.players[casterKey].hand;
  const card = hand[idx];
  if(!card) return;
  hand.splice(idx,1);
  state.actionCount++;
  playSfx('spell');
  log(`${nameOf(casterKey)}は「${card.name}」を発動した。`);
  render();
  resolveTargetThen(card.effectKey, casterKey, true, (target)=>{
    applyEffect(card.effectKey, casterKey, target, card);
    state.players[casterKey].graveyard.push(card);
    render();
    checkAutoEndTurn();
  }, ()=>{
    hand.push(card); state.actionCount--; render();
    checkAutoEndTurn();
  });
}
function useReleaseEffectCard(casterKey, card){
  if(card.hitodama<1) return false;
  card.hitodama--; state.hitodamaStock++;
  playSfx('release');
  log(`${nameOf(casterKey)}は「${card.name}」の解放効果を使った。`);
  render();
  resolveTargetThen(card.effectKey, casterKey, false, (target)=>{
    applyEffect(card.effectKey, casterKey, target, card);
    render();
    checkAutoEndTurn();
  }, ()=>{
    card.hitodama++; state.hitodamaStock--; render();
    checkAutoEndTurn();
  });
  return true;
}
function placeHitodamaOnCard(card){
  if(state.hitodamaStock<=0 || card.hitodama>=card.cap || state.actionCount>=2) { playSfx('cancel'); return false; }
  card.hitodama++; state.hitodamaStock--; state.actionCount++;
  playSfx('hitodama');
  log(`あなたは「${card.name}」にヒトダマを置いた。（${card.hitodama}/${card.cap}）`);
  render();
  return true;
}
function canDoAnything(){
  const st = state;
  if(st.active!=='player') return false;
  const p = st.players.player;
  if(st.actionCount<2){
    if(p.hand.some(c=>c.kind==='yokai') && countAliveField('player')<3) return true;
    if(p.hand.some(c=>c.kind==='spell')) return true;
    if(st.hitodamaStock>0 && p.field.some(c=>c && c.cap>c.hitodama)) return true;
  }
  if(!p.setSpell && p.hand.some(c=>c.kind==='spell')) return true;
  if(canAttackNow() && p.field.some(c=>c)) return true;
  if(p.field.some(c=>c && c.type==='kaihou' && c.hitodama>=1)) return true;
  return false;
}
function checkAutoEndTurn(){
  if(state.gameOver || state.active!=='player' || state.selection || state.pendingAttacker) return;
  if(!canDoAnything()){
    toast('他にできる操作がないため、ターンを終了します');
    setTimeout(()=>{
      if(!state.gameOver && state.active==='player' && !state.selection && !state.pendingAttacker){ endTurn(); }
    }, 900);
  }
}

/* =========================================================
   ターン進行
   ========================================================= */
function startTurn(){
  state.actionCount = 0; state.attacked = false; state.phase = 'main'; state.pendingAttacker=null;
  const p = state.players[state.active];
  if(p.deck.length>0){ p.hand.push(p.deck.pop()); log(`${nameOf(state.active)}はカードを1枚引いた。`); }
  else { log(`${nameOf(state.active)}の山札は0枚。引けなかった。`); }
  if(state.players[state.active].field.some(c=>c && c.defId==='tengu')){
    log('「天狗」の効果で1ダメージを受けた。');
    dealDamage(state.active, 1);
  }
  render();
  if(state.gameOver) return;
  if(state.active==='cpu'){ setTimeout(cpuMainPhase, 700); }
}
function goToBattlePhase(){
  if(state.gameOver || state.selection) return;
  if(state.turn===1){ log('先攻1ターン目はバトルフェイズを行えません。'); endTurn(); return; }
  if(state.players[state.active].attackLockUntilTurn === state.turn){
    log('「塗壁」の効果で、この手番は攻撃できない。');
    endTurn(); return;
  }
  state.phase = 'battle';
  render();
  if(state.active==='cpu'){ setTimeout(cpuBattlePhase, 700); }
}
function endTurn(){
  if(state.gameOver || state.selection) return;
  ['player','cpu'].forEach(k=>{
    state.players[k].field.slice().forEach(c=>{
      if(c && c.cursedUntilTurn===state.turn){
        log(`「提灯小僧」の呪いの効果で${c.name}が破壊された…（先ほどの戦闘の代償）`);
        destroyCard(c, k);
      }
    });
  });
  if(state.gameOver) return;
  state.turn++;
  state.active = oppKeyOf(state.active);
  render();
  showTurnBanner();
  setTimeout(startTurn, 650);
}
function endGame(winnerKey){
  state.gameOver = true;
  playSfx(winnerKey==='player' ? 'win' : 'lose');
  render();
  setTimeout(()=>showResult(winnerKey, false), 500);
}
function showTurnBanner(){
  const b = document.getElementById('turnBanner');
  const t = document.getElementById('turnBannerTxt');
  t.textContent = state.active==='player' ? 'YOUR TURN' : 'CPU TURN';
  playSfx('turn');
  b.classList.remove('hidden');
  setTimeout(()=>b.classList.add('hidden'), 1000);
}

/* =========================================================
   人間側アクション：手札（単タップ／ドラッグ）
   ========================================================= */
function tapHandCardDirect(idx){
  if(state.active!=='player' || state.gameOver || state.selection || state.pendingAttacker) return;
  const hand = state.players.player.hand;
  const card = hand[idx];
  if(!card) return;
  if(card.kind==='yokai'){
    if(state.actionCount>=2){ toast('アクションは2回まで（今回は使い切りました）'); playSfx('cancel'); return; }
    if(countAliveField('player')>=3){ toast('場がいっぱいです'); playSfx('cancel'); return; }
    hand.splice(idx,1);
    const slot = state.players.player.field.findIndex(c=>!c);
    state.players.player.field[slot] = card;
    state.actionCount++;
    if(card.defId==='nurikabe'){ state.players.player.attackLockUntilTurn = state.turn; }
    playSfx('play');
    log(`あなたは「${card.name}」を場に出した。`);
    render();
    checkAutoEndTurn();
  } else {
    if(state.actionCount>=2){ toast('アクションは2回まで（今回は使い切りました）'); playSfx('cancel'); return; }
    castSpellNow('player', idx);
  }
}
function setSpellFromHandIdx(idx){
  const hand = state.players.player.hand;
  const card = hand[idx];
  if(!card || card.kind!=='spell'){ playSfx('cancel'); return; }
  if(state.players.player.setSpell){ toast('すでにスペルがセットされています'); playSfx('cancel'); return; }
  hand.splice(idx,1);
  state.players.player.setSpell = card;
  playSfx('set');
  log('あなたはスペルを1枚、裏向きでセットした。');
  render();
  checkAutoEndTurn();
}

/* ---- 場の妖怪タップ（ヒトダマ／解放効果／攻撃をひとつのシートに統合） ---- */
function tapFieldCard(key, idx){
  if(state.gameOver) return;
  const card = state.players[key].field[idx];
  if(!card) return;
  if(state.active==='player' && key==='player' && !state.pendingAttacker){
    openYokaiActionSheet(card, idx);
  } else if(state.active==='player' && key==='cpu' && state.pendingAttacker){
    confirmAttack(state.pendingAttacker.card, {type:'yokai', card, ownerKey:'cpu'});
  } else {
    showDetailZoom(card);
  }
}
function canAttackNow(){
  return state.turn>1 && !state.attacked && !state.pendingAttacker &&
    state.players.player.attackLockUntilTurn !== state.turn;
}
function openYokaiActionSheet(card, idx){
  const canHitodama = state.actionCount<2 && card.hitodama<card.cap && state.hitodamaStock>0;
  let releaseBlockedNote = '';
  if(card.type==='kaihou' && card.hitodama>=1){
    if(card.defId==='karakasa' && !state.players.player.setSpell && !state.players.cpu.setSpell){
      releaseBlockedNote = '（セットされたスペルが無いため対象がありません）';
    } else if(card.defId==='nekomata' && !state.players.cpu.field.some(c=>c)){
      releaseBlockedNote = '（相手の場に妖怪がいないため対象がありません）';
    }
  }
  const canRelease = card.type==='kaihou' && card.hitodama>=1 && !releaseBlockedNote;
  const canAttack = canAttackNow();
  let attackNote = '';
  if(!canAttack){
    if(state.turn===1) attackNote = '（先攻1ターン目は攻撃できません）';
    else if(state.attacked) attackNote = '（この手番はすでに攻撃済み）';
    else if(state.players.player.attackLockUntilTurn===state.turn) attackNote = '（「塗壁」の効果で攻撃できません）';
  }
  let typeNote = '';
  if(card.type==='hyoi') typeNote = '<div class="sstats" style="margin-top:4px;">※憑依効果：ヒトダマが1個以上ある間、自動で発動し続けます（手動での発動は不要です）</div>';
  else if(card.type==='jyoji') typeNote = '<div class="sstats" style="margin-top:4px;">※常在効果：場にいる間、自動で発動します（手動での発動は不要です）</div>';
  else if(card.type==='kaihou' && card.hitodama<1) typeNote = '<div class="sstats" style="margin-top:4px;">※解放効果を使うにはヒトダマが1個以上必要です</div>';
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <div class="shead">
      <div class="sicon" style="background-image:url('${CARD_IMG[card.defId]}')"></div>
      <div><div class="sname">${card.name}</div>
      <div class="sstats">攻撃力 ${atkBreakdown(card)} ／ ヒトダマ ${card.hitodama}/${card.cap}</div></div>
    </div>
    <div class="sdesc">${card.desc}</div>
    ${typeNote}
    <div class="sbtns">
      <button class="primary" id="sh_atk" style="background:var(--red)" ${canAttack?'':'disabled'}>攻撃する${attackNote}</button>
      <button class="primary" id="sh_hito" ${canHitodama?'':'disabled'}>ヒトダマを1個置く（${card.hitodama}/${card.cap}）</button>
      ${card.type==='kaihou' ? `<button class="primary2" id="sh_release" ${canRelease?'':'disabled'}>解放効果を使う${releaseBlockedNote}</button>` : ''}
      <button class="cancel" id="sh_cancel">キャンセル</button>
    </div>
  `;
  showSheet();
  const close = ()=>hideSheet();
  if(canAttack) document.getElementById('sh_atk').onclick = ()=>{ close(); playSfx('tap'); startAttackerSelection(card); };
  if(canHitodama) document.getElementById('sh_hito').onclick = ()=>{ close(); placeHitodamaOnCard(card); checkAutoEndTurn(); };
  if(card.type==='kaihou'){
    const rb = document.getElementById('sh_release');
    if(canRelease) rb.onclick = ()=>{ close(); useReleaseEffectCard('player', card); };
  }
  document.getElementById('sh_cancel').onclick = close;
}
function startAttackerSelection(card){
  const oppField = state.players.cpu.field.filter(c=>c);
  if(oppField.length===0){
    confirmAttack(card, {type:'player', key:'cpu'});
  } else {
    state.pendingAttacker = {card};
    toast('攻撃対象の妖怪をタップしてください');
    render();
  }
}
function confirmAttack(attackerCard, target){
  state.pendingAttacker = null;
  hideToast();
  declareAttack(attackerCard, 'player', target);
}

/* =========================================================
   攻撃解決（共通）
   ========================================================= */
function declareAttack(attackerCard, attackerKey, target){
  state.attacked = true;
  state.negatedAttack = false;
  playSfx('attack');
  const defenderKey = oppKeyOf(attackerKey);
  const defender = state.players[defenderKey];
  log(`${nameOf(attackerKey)}の「${attackerCard.name}」が攻撃を宣言！ 対象：${target.type==='player'?nameOf(target.key):target.card.name}`);
  render();
  if(defender.setSpell){
    if(defenderKey==='cpu'){
      const decide = cpuDecideActivateTrap(defender.setSpell, attackerCard, attackerKey, target);
      setTimeout(()=>{
        if(decide) activateSetSpellAsTrap(defenderKey, attackerCard, attackerKey, target);
        resolveAfterTrapCheck(attackerCard, attackerKey, target);
      }, 600);
    } else {
      showTrapPrompt(defenderKey, attackerCard, attackerKey, target);
    }
  } else {
    setTimeout(()=>resolveAfterTrapCheck(attackerCard, attackerKey, target), 400);
  }
}
function showTrapPrompt(defenderKey, attackerCard, attackerKey, target){
  const spell = state.players[defenderKey].setSpell;
  const box = document.getElementById('trapPrompt');
  box.innerHTML = `
    <h3>甘いっ！ トラップ発動！？</h3>
    <p><b>${spell.name}</b><br>${spell.desc}</p>
    <p style="margin-top:8px;">相手が攻撃してきました。このスペルを発動しますか？</p>
    <div class="tbtns">
      <button class="yes" id="tp_yes">発動する</button>
      <button class="no" id="tp_no">発動しない</button>
    </div>
  `;
  document.getElementById('trapPromptOverlay').classList.remove('hidden');
  document.getElementById('tp_yes').onclick = ()=>{
    document.getElementById('trapPromptOverlay').classList.add('hidden');
    activateSetSpellAsTrap(defenderKey, attackerCard, attackerKey, target);
    resolveAfterTrapCheck(attackerCard, attackerKey, target);
  };
  document.getElementById('tp_no').onclick = ()=>{
    document.getElementById('trapPromptOverlay').classList.add('hidden');
    resolveAfterTrapCheck(attackerCard, attackerKey, target);
  };
}
function activateSetSpellAsTrap(defenderKey, attackerCard, attackerKey, originalTarget){
  const spell = state.players[defenderKey].setSpell;
  const ek = spell.effectKey;
  const oppOfDefender = oppKeyOf(defenderKey);
  playSfx('trap');
  log(`${nameOf(defenderKey)}はセットしていた「${spell.name}」を発動した！`);
  state.players[defenderKey].graveyard.push(spell);
  state.players[defenderKey].setSpell = null;

  if(ek==='freeHitodama3'){
    if(originalTarget.type==='yokai'){
      const def = originalTarget.card;
      const atk = baseEffAtk(attackerCard);
      let needed = atk - baseEffAtk(def);
      let placed = 0;
      while(needed>0 && placed<3 && def.cap>def.hitodama && state.hitodamaStock>0){
        def.hitodama++; state.hitodamaStock--; placed++; needed--;
      }
      log(`${def.name}にヒトダマを${placed}個置いた。`);
      toast(placed>0 ? `「${spell.name}」で${def.name}にヒトダマを${placed}個置いた` : '置ける先がなく、不発だった');
    } else {
      log('対象がなく、不発だった。');
      toast('対象がなく、不発だった');
    }
    render();
    return;
  }
  if(ek==='destroyChargedUpTo2'){
    applyEffect(ek, defenderKey, {cards:[{key:attackerKey, card:attackerCard}]}, spell);
    render();
    return;
  }
  if(ek==='destroyHighestAtk'){
    applyEffect(ek, defenderKey, {type:'yokai', card:attackerCard, ownerKey:attackerKey}, spell);
    render();
    return;
  }
  if(ek==='draw2'){
    applyEffect(ek, defenderKey, {}, spell);
    render();
    return;
  }
  if(ek==='reviveFromEitherGrave'){
    const cands = [];
    state.players[defenderKey].graveyard.forEach(c=>{ if(c.kind==='yokai') cands.push({from:defenderKey, card:c}); });
    state.players[oppOfDefender].graveyard.forEach(c=>{ if(c.kind==='yokai') cands.push({from:oppOfDefender, card:c}); });
    if(cands.length===0 || countAliveField(defenderKey)>=3){
      applyEffect(ek, defenderKey, {}, spell);
    } else {
      const best = cands.reduce((a,b)=> baseEffAtk(b.card)>baseEffAtk(a.card)?b:a);
      applyEffect(ek, defenderKey, best, spell);
    }
    render();
    return;
  }
  if(ek==='moveHitodama'){
    let done = false;
    if(originalTarget.type==='yokai'){
      const def = originalTarget.card;
      if(def.cap>def.hitodama){
        const srcCands = [];
        ['player','cpu'].forEach(k=>{
          state.players[k].field.forEach(c=>{ if(c && c.hitodama>=1 && c.uid!==def.uid && !isProtected(c)) srcCands.push(c); });
        });
        if(srcCands.length){
          const src = srcCands.sort((a,b)=>baseEffAtk(b)-baseEffAtk(a))[0];
          applyEffect(ek, defenderKey, {from:{card:src}, to:{card:def}}, spell);
          done = true;
        }
      }
    }
    if(!done) applyEffect(ek, defenderKey, {}, spell);
    render();
    return;
  }
  render();
}
function resolveAfterTrapCheck(attackerCard, attackerKey, target){
  if(state.gameOver) return;
  if(!isCardAlive(attackerCard)){
    log(`${attackerCard.name}は攻撃前に破壊されてしまい、攻撃は不発になった。`);
    afterAttackCleanup(); return;
  }
  if(target.type==='yokai' && !isCardAlive(target.card)){
    log('攻撃対象は既にいなくなっており、攻撃は不発になった。');
    afterAttackCleanup(); return;
  }
  resolveCombat(attackerCard, attackerKey, target);
  afterAttackCleanup();
}
function tryYukionnaShield(card, ownerKey){
  if(card.defId==='yukionna' && card.hitodama>=1){
    card.hitodama--; state.hitodamaStock++;
    log(`${card.name}は「雪女」の効果でヒトダマを1個失い、破壊を免れた！`);
    return true;
  }
  return false;
}
function findLiveCard(card){
  if(!card) return card;
  for(const k of ['player','cpu']){
    const found = state.players[k].field.find(c=>c && c.uid===card.uid);
    if(found) return found;
  }
  return card;
}
function resolveCombat(attackerCard, attackerKey, target){
  attackerCard = findLiveCard(attackerCard);
  if(target.type==='yokai') target.card = findLiveCard(target.card);
  const atk = baseEffAtk(attackerCard);
  if(target.type==='yokai'){
    const defenderCard = target.card, defenderKey = target.ownerKey;
    const defAtk = baseEffAtk(defenderCard);

    // 提灯小僧：呪いマークを先に適用
    if(attackerCard.defId==='chochin' && attackerCard.hitodama>=1){
      defenderCard.cursedUntilTurn = state.turn;
      log(`「提灯小僧」の憑依効果！ ${defenderCard.name}は手番終了時に破壊される呪いを受けた。`);
    }
    if(defenderCard.defId==='chochin' && defenderCard.hitodama>=1){
      attackerCard.cursedUntilTurn = state.turn;
      log(`「提灯小僧」の憑依効果！ ${attackerCard.name}は手番終了時に破壊される呪いを受けた。`);
    }

    if(atk>defAtk){
      const diff = atk-defAtk;
      log(`戦闘！ ${attackerCard.name}(${atkBreakdown(attackerCard)}) vs ${defenderCard.name}(${atkBreakdown(defenderCard)}) → ${defenderCard.name}が敗北！`);
      if(!tryYukionnaShield(defenderCard, defenderKey)){
        destroyCard(defenderCard, defenderKey);
        dealDamage(defenderKey, diff);
      }
      if(attackerCard.defId==='rokuro' && attackerCard.hitodama>=1){
        drawOne(attackerKey);
        log(`「轆轤首」の憑依効果！ ${nameOf(attackerKey)}はカードを1枚引いた。`);
      }
    } else if(atk<defAtk){
      const diff = defAtk-atk;
      log(`戦闘！ ${attackerCard.name}(${atkBreakdown(attackerCard)}) vs ${defenderCard.name}(${atkBreakdown(defenderCard)}) → ${attackerCard.name}が敗北！`);
      if(!tryYukionnaShield(attackerCard, attackerKey)){
        destroyCard(attackerCard, attackerKey);
        dealDamage(attackerKey, diff);
      }
      if(defenderCard.defId==='rokuro' && defenderCard.hitodama>=1){
        drawOne(defenderKey);
        log(`「轆轤首」の憑依効果！ ${nameOf(defenderKey)}はカードを1枚引いた。`);
      }
    } else {
      log(`戦闘！ ${attackerCard.name}(${atkBreakdown(attackerCard)}) vs ${defenderCard.name}(${atkBreakdown(defenderCard)}) → 相討ち。`);
      const shieldA = tryYukionnaShield(attackerCard, attackerKey);
      const shieldD = tryYukionnaShield(defenderCard, defenderKey);
      if(!shieldA) destroyCard(attackerCard, attackerKey);
      if(!shieldD) destroyCard(defenderCard, defenderKey);
    }
  } else {
    log(`${attackerCard.name}(${atk})が${nameOf(target.key)}に直接攻撃！`);
    dealDamage(target.key, atk);
  }
}
function afterAttackCleanup(){
  render();
  checkAutoEndTurn();
  if(state.awaitingCpuTurnEndAfterAttack){
    state.awaitingCpuTurnEndAfterAttack = false;
    setTimeout(()=>{ if(!state.gameOver) endTurn(); }, 700);
  }
}

/* =========================================================
   CPU AI
   ========================================================= */
function cpuMainPhase(){
  if(state.gameOver) return;
  let guard = 0;
  const step = ()=>{
    if(state.gameOver) return;
    guard++;
    if(state.actionCount<2 && guard<8){
      const did = cpuTakeOneMainAction();
      render();
      if(did){ setTimeout(step, 600); return; }
    }
    cpuMaybeSetTrap();
    render();
    setTimeout(goToBattlePhase, 700);
  };
  setTimeout(step, 500);
}
function cpuTakeOneMainAction(){
  const cpu = state.players.cpu;
  const oppField = state.players.player.field.filter(c=>c);

  const trySpell = (defId, condition)=>{
    const idx = cpu.hand.findIndex(c=>c.defId===defId);
    if(idx>=0 && condition()){ castSpellNow('cpu', idx); return true; }
    return false;
  };

  if(trySpell('hamaya', ()=>{
    const all = [...state.players.player.field, ...state.players.cpu.field].filter(c=>c);
    if(!all.length) return false;
    const maxAtk = Math.max(...all.map(c=>baseEffAtk(c)));
    const top = all.find(c=>baseEffAtk(c)===maxAtk);
    return top && oppField.includes(top) && maxAtk>=3;
  })) return true;

  if(trySpell('jufu', ()=> oppField.some(c=>c.hitodama>=1))) return true;

  if(countAliveField('cpu')<3){
    const yokaiInHand = cpu.hand.map((c,i)=>({c,i})).filter(x=>x.c.kind==='yokai');
    if(yokaiInHand.length>0){
      yokaiInHand.sort((a,b)=> b.c.baseAtk - a.c.baseAtk);
      const pick = yokaiInHand[0];
      cpu.hand.splice(pick.i,1);
      cpu.field[cpu.field.findIndex(c=>!c)] = pick.c;
      state.actionCount++;
      if(pick.c.defId==='nurikabe'){ state.players.cpu.attackLockUntilTurn = state.turn; }
      playSfx('play');
      log(`CPUは「${pick.c.name}」を場に出した。`);
      return true;
    }
  }

  if(trySpell('boseki', ()=> countAliveField('cpu')<3 &&
    (cpu.graveyard.some(c=>c.kind==='yokai') || state.players.player.graveyard.some(c=>c.kind==='yokai')))) return true;

  if(trySpell('kozuchi', ()=> cpu.deck.length>0)) return true;

  if(trySpell('sake', ()=> cpu.field.some(c=>c && c.cap>c.hitodama) && state.hitodamaStock>0)) return true;

  for(const card of cpu.field){
    if(!card || card.type!=='kaihou' || card.hitodama<1) continue;
    if(card.defId==='karakasa' && state.players.player.setSpell){ return useReleaseEffectCard('cpu', card); }
    if(card.defId==='nekomata' && oppField.length && oppField.some(c=>baseEffAtk(c)>baseEffAtk(card))){ return useReleaseEffectCard('cpu', card); }
  }

  if(state.hitodamaStock>0){
    const withRoom = cpu.field.filter(c=>c && c.cap>c.hitodama);
    if(withRoom.length>0){
      withRoom.sort((a,b)=>baseEffAtk(b)-baseEffAtk(a));
      const t = withRoom[0];
      t.hitodama++; state.hitodamaStock--; state.actionCount++;
      playSfx('hitodama');
      log(`CPUは「${t.name}」にヒトダマを置いた。（${t.hitodama}/${t.cap}）`);
      return true;
    }
  }
  return false;
}
function cpuMaybeSetTrap(){
  const cpu = state.players.cpu;
  if(cpu.setSpell) return;
  const priority = ['jufu','hamaya','sake'];
  for(const defId of priority){
    const idx = cpu.hand.findIndex(c=>c.defId===defId);
    if(idx>=0){
      const [card] = cpu.hand.splice(idx,1);
      cpu.setSpell = card;
      playSfx('set');
      log('CPUはスペルを1枚、裏向きでセットした。');
      return;
    }
  }
}
function cpuDecideActivateTrap(spell, attackerCard, attackerKey, target){
  const ek = spell.effectKey;
  if(ek==='destroyChargedUpTo2') return attackerCard.hitodama>=1;
  if(ek==='destroyHighestAtk'){
    const all = [...state.players.player.field, ...state.players.cpu.field].filter(c=>c);
    if(!all.length) return false;
    const maxAtk = Math.max(...all.map(c=>baseEffAtk(c)));
    return baseEffAtk(attackerCard)===maxAtk;
  }
  if(ek==='freeHitodama3'){
    if(target.type==='yokai'){
      const def = target.card;
      const room = def.cap-def.hitodama;
      if(room<=0) return false;
      const need = baseEffAtk(attackerCard) - baseEffAtk(def);
      return need>0 && need<=Math.min(room, state.hitodamaStock, 3);
    }
    return false;
  }
  return false;
}
function cpuBattlePhase(){
  if(state.gameOver) return;
  const cpu = state.players.cpu;
  const attackers = cpu.field.filter(c=>c);
  const oppField = state.players.player.field.filter(c=>c);
  if(attackers.length===0){ setTimeout(endTurn, 500); return; }

  cpuPreBattleReleases(oppField);

  let chosen=null, target=null;
  if(oppField.length===0){
    attackers.sort((a,b)=>baseEffAtk(b)-baseEffAtk(a));
    chosen = attackers[0];
    target = {type:'player', key:'player'};
  } else {
    let best=null;
    attackers.forEach(atkC=>{
      const myAtk = baseEffAtk(atkC);
      oppField.forEach(defC=>{
        const defAtk = baseEffAtk(defC);
        let score;
        if(myAtk>defAtk) score = 100+(myAtk-defAtk);
        else if(myAtk===defAtk) score = 10;
        else score = -100+(myAtk-defAtk);
        if(!best || score>best.score) best = {score, atkC, defC};
      });
    });
    if(best && best.score>=10){
      chosen = best.atkC; target = {type:'yokai', card:best.defC, ownerKey:'player'};
    } else if(best && state.players.cpu.life > state.players.player.life && Math.random()<0.35){
      chosen = best.atkC; target = {type:'yokai', card:best.defC, ownerKey:'player'};
    }
  }

  if(chosen && target){
    state.awaitingCpuTurnEndAfterAttack = true;
    declareAttack(chosen, 'cpu', target);
  } else {
    log('CPUは攻撃を見送った。');
    setTimeout(endTurn, 500);
  }
}
function cpuPreBattleReleases(oppField){
  const cpu = state.players.cpu;
  cpu.field.forEach(card=>{
    if(!card || card.type!=='kaihou' || card.hitodama<1) return;
    if(card.defId==='nekomata' && oppField.length){
      const strongest = oppField.slice().sort((a,b)=>baseEffAtk(b)-baseEffAtk(a))[0];
      if(baseEffAtk(strongest) > baseEffAtk(card)){
        useReleaseEffectCard('cpu', card);
      }
    }
  });
}

function handleFieldTap(key, idx){
  const card = state.players[key].field[idx];
  if(state.selection){
    const sel = state.selection;
    if(sel.mode==='distribute'){
      if(card && card.cap>card.hitodama && state.hitodamaStock>0 && !(sel.isSpell && isProtected(card))){
        card.hitodama++; state.hitodamaStock--; sel.remaining--;
        playSfx('hitodama');
        log(`ヒトダマを1個置いた。（${card.name}）`);
        if(sel.remaining<=0){ const cb=sel.onFinish; state.selection=null; hideToast(); cb(); }
        else render();
      }
      return;
    }
    if(sel.mode==='multi'){
      const found = sel.candidates.find(c=>c.key===key && c.idx===idx);
      if(found){
        const pi = sel.picked.findIndex(p=>p.key===key && p.idx===idx);
        if(pi>=0) sel.picked.splice(pi,1);
        else if(sel.picked.length<sel.max) sel.picked.push(found);
        playSfx('tap');
        render();
      }
      return;
    }
    if(sel.mode==='single'){
      const found = sel.candidates.find(c=>c.key===key && c.idx===idx);
      if(found){
        const cb = sel.onConfirm; state.selection=null; hideToast(); cb(found);
      }
      return;
    }
    return; // graveyard/setspell modes use the sheet, not field taps
  }
  if(!card) return;
  tapFieldCard(key, idx);
}

/* =========================================================
   ドラッグ操作 共通ヘルパー
   ========================================================= */
function createGhostFromElement(sourceEl){
  const rect = sourceEl.getBoundingClientRect();
  const ghost = sourceEl.cloneNode(true);
  ghost.style.position='fixed'; ghost.style.left=rect.left+'px'; ghost.style.top=rect.top+'px';
  ghost.style.width=rect.width+'px'; ghost.style.height=rect.height+'px';
  ghost.style.pointerEvents='none'; ghost.style.zIndex=200; ghost.style.opacity='0.88';
  ghost.style.transform='scale(1.08) rotate(-3deg)'; ghost.style.margin='0';
  document.body.appendChild(ghost);
  return ghost;
}
function createGhostHitodama(){
  const g = document.createElement('div');
  g.style.cssText='position:fixed;width:30px;height:38px;pointer-events:none;z-index:200;font-size:26px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));';
  g.textContent='👻';
  document.body.appendChild(g);
  return g;
}
function findDropZoneAt(x,y){
  const el = document.elementFromPoint(x,y);
  if(!el) return null;
  const dz = el.closest('[data-dropzone]');
  if(!dz) return null;
  return {type:dz.dataset.dropzone, idx: dz.dataset.idx!==undefined ? parseInt(dz.dataset.idx) : null};
}
function setDropZoneHighlight(on){
  document.querySelectorAll('[data-dropzone]').forEach(el=>{
    if(on) el.classList.add('dropready'); else el.classList.remove('dropready');
  });
}
function setupHandCardGestures(el, idx){
  el.addEventListener('pointerdown', (e)=>{
    if(state.active!=='player' || state.gameOver || state.selection || state.pendingAttacker) return;
    const card = state.players.player.hand[idx];
    if(!card) return;
    const sx=e.clientX, sy=e.clientY;
    let longPressed=false, dragging=false, ghost=null;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    const timer = setTimeout(()=>{
      longPressed = true;
      if(navigator.vibrate) navigator.vibrate(12);
      showDetailZoom(card);
    }, 480);
    const move = (ev)=>{
      const dist = Math.hypot(ev.clientX-sx, ev.clientY-sy);
      if(dist>6){ clearTimeout(timer); }
      if(!dragging && !longPressed && dist>8){
        dragging = true;
        ghost = createGhostFromElement(el);
        setDropZoneHighlight(true);
      }
      if(dragging && ghost){ ghost.style.left=(ev.clientX-32)+'px'; ghost.style.top=(ev.clientY-46)+'px'; }
    };
    const up = (ev)=>{
      clearTimeout(timer);
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      setDropZoneHighlight(false);
      if(dragging){
        if(ghost) ghost.remove();
        const dz = findDropZoneAt(ev.clientX, ev.clientY);
        if(dz && dz.type==='ownfield'){ tapHandCardDirect(idx); }
        else if(dz && dz.type==='setspell' && card.kind==='spell'){ setSpellFromHandIdx(idx); }
        else { playSfx('cancel'); }
      } else if(!longPressed){
        tapHandCardDirect(idx);
      }
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });
}
function setupHitodamaPoolGestures(el){
  el.addEventListener('pointerdown', (e)=>{
    if(state.active!=='player' || state.gameOver || state.selection || state.pendingAttacker) return;
    if(state.hitodamaStock<=0){ playSfx('cancel'); toast('ヒトダマストックがありません'); return; }
    const sx=e.clientX, sy=e.clientY;
    let dragging=false, ghost=null;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    const move = (ev)=>{
      const dist = Math.hypot(ev.clientX-sx, ev.clientY-sy);
      if(!dragging && dist>6){
        dragging = true;
        ghost = createGhostHitodama();
        setDropZoneHighlight(true);
      }
      if(dragging && ghost){ ghost.style.left=(ev.clientX-15)+'px'; ghost.style.top=(ev.clientY-19)+'px'; }
    };
    const up = (ev)=>{
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      setDropZoneHighlight(false);
      if(dragging){
        if(ghost) ghost.remove();
        const dz = findDropZoneAt(ev.clientX, ev.clientY);
        if(dz && dz.type==='ownfield' && dz.idx!==null){
          const card = state.players.player.field[dz.idx];
          if(card){ placeHitodamaOnCard(card); checkAutoEndTurn(); } else { playSfx('cancel'); }
        } else { playSfx('cancel'); }
      }
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });
}
function setupFieldCardGestures(el, key, idx){
  el.addEventListener('pointerdown', (e)=>{
    const card = state.players[key].field[idx];
    if(!card) return;
    const sx=e.clientX, sy=e.clientY;
    let longPressed=false, dragging=false, ghost=null;
    const inSelectionMode = !!(state.selection || state.pendingAttacker);
    const canDragAttack = key==='player' && state.active==='player' && !state.gameOver &&
      !state.selection && !state.pendingAttacker && canAttackNow();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    // 対象選択中（扇の2段階選択や複数選択など）は長押しタイマーを起動しない。
    // タップがそのまま長押し判定に食われて「決定できない」ように見えるのを防ぐ。
    let timer = null;
    if(!inSelectionMode){
      timer = setTimeout(()=>{
        longPressed = true;
        if(navigator.vibrate) navigator.vibrate(12);
        showDetailZoom(card);
      }, 480);
    }
    const move = (ev)=>{
      const dist = Math.hypot(ev.clientX-sx, ev.clientY-sy);
      if(dist>6){ clearTimeout(timer); }
      if(!dragging && !longPressed && canDragAttack && dist>8){
        dragging = true;
        ghost = createGhostFromElement(el);
        setOppDropHighlight(true);
      }
      if(dragging && ghost){ ghost.style.left=(ev.clientX-31)+'px'; ghost.style.top=(ev.clientY-46)+'px'; }
    };
    const up = (ev)=>{
      if(timer) clearTimeout(timer);
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      if(dragging){
        setOppDropHighlight(false);
        if(ghost) ghost.remove();
        const dz = findDropZoneAt(ev.clientX, ev.clientY);
        dragging = false;
        handleAttackDrop(card, dz);
      } else if(!longPressed){
        handleFieldTap(key, idx);
      }
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });
}
function setOppDropHighlight(on){
  document.querySelectorAll('[data-dropzone="oppfield"]').forEach(el=>{
    if(on) el.classList.add('dropready'); else el.classList.remove('dropready');
  });
}
function handleAttackDrop(attackerCard, dz){
  if(!canAttackNow()){ toast('攻撃はできません'); playSfx('cancel'); return; }
  if(!dz || dz.type!=='oppfield'){ playSfx('cancel'); return; }
  const oppField = state.players.cpu.field;
  const hasAnyOpp = oppField.some(c=>c);
  if(dz.idx!==null && !isNaN(dz.idx) && oppField[dz.idx]){
    confirmAttack(attackerCard, {type:'yokai', card:oppField[dz.idx], ownerKey:'cpu'});
  } else if(!hasAnyOpp){
    confirmAttack(attackerCard, {type:'player', key:'cpu'});
  } else {
    toast('相手の妖怪めがけてドラッグしてください');
    playSfx('cancel');
  }
}

function cardHtml(card){
  const img = CARD_IMG[card.defId] || '';
  if(card.kind==='yokai'){
    const dots = Array.from({length:card.cap}).map((_,i)=>`<span class="dot ${i<card.hitodama?'filled':''}"></span>`).join('');
    return `<div class="card" style="background-image:url('${img}')">
      <div class="cardShade"></div>
      <div class="cfoot"><span class="catk">${baseEffAtk(card)}</span><span class="chd">${dots}</span></div>
    </div>`;
  } else {
    return `<div class="card" style="background-image:url('${img}')">
      <div class="cardShade"></div>
      <div class="cfoot"><span style="font-size:8px;color:#fff;background:rgba(0,0,0,.45);padding:1px 4px;border-radius:4px;">スペル</span></div>
    </div>`;
  }
}
function render(){
  if(!state) return;
  try{
    document.getElementById('oppLifeNum').textContent = state.players.cpu.life;
    document.getElementById('selfLifeNum').textContent = state.players.player.life;

    document.getElementById('oppHandRow').innerHTML =
      Array.from({length: state.players.cpu.hand.length}).map(()=>`<div class="pile" style="width:24px;height:36px;"><div class="facedown" style="font-size:11px;">🂠</div></div>`).join('');

    document.getElementById('oppDeckPile').innerHTML = `<div>山</div><div class="n">${state.players.cpu.deck.length}</div>`;
    document.getElementById('oppGravePile').innerHTML = `<div>墓</div><div class="n">${state.players.cpu.graveyard.length}</div>`;
    document.getElementById('playerDeckPile').innerHTML = `<div>山</div><div class="n">${state.players.player.deck.length}</div>`;
    document.getElementById('playerGravePile').innerHTML = `<div>墓</div><div class="n">${state.players.player.graveyard.length}</div>`;
    document.getElementById('stockNum').textContent = state.hitodamaStock;
    document.getElementById('stockNumOpp').textContent = state.hitodamaStock;

    renderField('cpu', document.getElementById('oppField'));
    renderField('player', document.getElementById('playerField'));

    document.getElementById('oppSetSpellSlot').innerHTML = state.players.cpu.setSpell
      ? `<div class="slot mini"><div class="facedown">🏮</div></div>` : `<div class="slot mini" style="border-style:dotted; opacity:.3;"></div>`;
    const oppSetEl = document.querySelector('#oppSetSpellSlot .slot');
    if(oppSetEl) oppSetEl.onclick = ()=>{ if(state.players.cpu.setSpell) toast('相手が伏せたスペル（非公開）'); };

    document.getElementById('playerSetSpellSlot').innerHTML = state.players.player.setSpell
      ? `<div class="slot mini" id="mySetSpell" data-dropzone="setspell"><div class="facedown">🏮</div></div>`
      : `<div class="slot mini" data-dropzone="setspell"><span class="setzone-hint">ここへ<br>セット</span></div>`;
    const mySetEl = document.getElementById('mySetSpell');
    if(mySetEl) mySetEl.onclick = ()=>{ showDetailZoom(state.players.player.setSpell); };

    const handRow = document.getElementById('handRow');
    handRow.innerHTML = '';
    state.players.player.hand.forEach((card, idx)=>{
      const d = document.createElement('div');
      d.className = 'handcard';
      d.innerHTML = cardHtml(card);
      setupHandCardGestures(d, idx);
      handRow.appendChild(d);
    });

    const poolEl = document.getElementById('hitodamaPoolToken');
    if(poolEl && !poolEl.dataset.wired){ setupHitodamaPoolGestures(poolEl); poolEl.dataset.wired='1'; }
  }catch(e){
    console.error('render() partial failure:', e);
  }

  const phaseLabel = document.getElementById('phaseLabel');
  const controls = document.getElementById('phaseControls');
  setEndButtonVisible(false);
  if(state.gameOver){ phaseLabel.textContent=''; controls.innerHTML=''; return; }

  if(state.selection){
    const sel = state.selection;
    if(sel.mode==='multi'){
      phaseLabel.textContent = `対象を選んでください（${sel.picked.length}/${sel.max}件選択中）`;
      controls.innerHTML = `<button class="ctrlbtn" id="confirmMulti" ${sel.picked.length? '':'disabled'}>これで発動</button><button class="ctrlbtn secondary" id="cancelSelBtn">キャンセル</button>`;
      document.getElementById('confirmMulti').onclick = ()=>{ const cb=sel.onConfirm; const picked=sel.picked; state.selection=null; hideToast(); playSfx('tap'); cb(picked); };
      document.getElementById('cancelSelBtn').onclick = ()=>{ const cb=sel.onCancel; state.selection=null; hideToast(); if(cb) cb(); render(); };
    } else if(sel.mode==='distribute'){
      phaseLabel.textContent = `ヒトダマを配置中（あと${sel.remaining}個・終了してもOK）`;
      controls.innerHTML = `<button class="ctrlbtn" id="finishDist">ここで終了</button>`;
      document.getElementById('finishDist').onclick = ()=>{ const cb=sel.onFinish; state.selection=null; hideToast(); cb(); };
    } else if(sel.mode==='graveyard' || sel.mode==='setspell'){
      phaseLabel.textContent = '対象を選んでください';
      controls.innerHTML = '';
    } else {
      phaseLabel.textContent = '対象を選んでください（光っているカードをタップ）';
      controls.innerHTML = `<button class="ctrlbtn secondary" id="cancelSelBtn">キャンセル</button>`;
      document.getElementById('cancelSelBtn').onclick = ()=>{ const cb=sel.onCancel; state.selection=null; hideToast(); if(cb) cb(); render(); };
    }
    return;
  }

  if(state.active!=='player'){
    phaseLabel.textContent = 'CPU の 手番です…';
    controls.innerHTML = '';
    setEndButtonVisible(false);
  } else if(state.pendingAttacker){
    phaseLabel.textContent = '攻撃対象の妖怪をタップしてください';
    controls.innerHTML = `<button class="ctrlbtn secondary" id="cancelAtk">攻撃をやめる</button>`;
    document.getElementById('cancelAtk').onclick = ()=>{ state.pendingAttacker=null; hideToast(); render(); };
    setEndButtonVisible(false);
  } else {
    const atkNote = state.attacked ? '攻撃済み' : (canAttackNow() ? '攻撃可能' : '攻撃不可');
    phaseLabel.textContent = `あなたの手番（アクション ${state.actionCount}/2・${atkNote}）`;
    controls.innerHTML = '';
    setEndButtonVisible(true);
  }
}
function setEndButtonVisible(on){
  const btn = document.getElementById('endTurnBtn');
  if(!btn) return;
  if(on) btn.classList.remove('hidden'); else btn.classList.add('hidden');
}
function renderField(key, container){
  container.innerHTML = '';
  state.players[key].field.forEach((card, idx)=>{
    const slot = document.createElement('div');
    slot.className = 'slot';
    if(key==='player'){ slot.dataset.dropzone='ownfield'; slot.dataset.idx=idx; }
    else { slot.dataset.dropzone='oppfield'; slot.dataset.idx=idx; }
    if(card){ slot.innerHTML = cardHtml(card); }
    if(state.selection){
      const sel = state.selection;
      if(sel.mode==='single' || sel.mode==='multi'){
        if(sel.candidates.some(c=>c.key===key && c.idx===idx)) slot.classList.add('selectable');
        if(sel.mode==='multi' && sel.picked.some(p=>p.key===key && p.idx===idx)) slot.classList.add('picked-target');
      } else if(sel.mode==='distribute'){
        if(card && card.cap>card.hitodama && state.hitodamaStock>0 && !(sel.isSpell && isProtected(card))) slot.classList.add('selectable');
      }
    }
    if(state.pendingAttacker && key==='cpu' && card) slot.classList.add('selectable');
    if(key==='player' && card && !state.selection && !state.pendingAttacker && state.active==='player' && canAttackNow()){
      slot.classList.add('atk-ready');
    }
    if(card){ setupFieldCardGestures(slot, key, idx); }
    container.appendChild(slot);
  });
}
