   ========================================================= */
function showSheet(){ document.getElementById('sheetOverlay').classList.remove('hidden'); }
function hideSheet(){ document.getElementById('sheetOverlay').classList.add('hidden'); }
document.getElementById('sheetOverlay').addEventListener('click', (e)=>{ if(e.target.id==='sheetOverlay') hideSheet(); });

function showDetailZoom(card){
  playSfx('tap');
  const box = document.getElementById('detailCard');
  const img = CARD_IMG[card.defId] || '';
  let liveStats = '';
  if(card.kind==='yokai'){
    liveStats = `<div class="dstats">現在の攻撃力 ${atkBreakdown(card)} ／ ヒトダマ ${card.hitodama}/${card.cap}</div>`;
  }
  box.innerHTML = `
    <img src="${img}" style="width:100%; max-width:260px; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.45);">
    ${liveStats}
    <button id="detailClose">閉じる</button>
  `;
  document.getElementById('detailOverlay').classList.remove('hidden');
  document.getElementById('detailClose').onclick = ()=>document.getElementById('detailOverlay').classList.add('hidden');
}
document.getElementById('detailOverlay').addEventListener('click', (e)=>{ if(e.target.id==='detailOverlay') e.currentTarget.classList.add('hidden'); });

let toastTimer=null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 2600);
}
function hideToast(){ document.getElementById('toast').classList.add('hidden'); }
function showConfirm(message, onYes, onNo){
  const box = document.getElementById('confirmBox');
  box.innerHTML = `
    <p>${message}</p>
    <div class="tbtns">
      <button class="yes" id="cf_yes">はい</button>
      <button class="no" id="cf_no">いいえ</button>
    </div>
  `;
  document.getElementById('confirmOverlay').classList.remove('hidden');
  document.getElementById('cf_yes').onclick = ()=>{
    document.getElementById('confirmOverlay').classList.add('hidden');
    if(onYes) onYes();
  };
  document.getElementById('cf_no').onclick = ()=>{
    document.getElementById('confirmOverlay').classList.add('hidden');
    if(onNo) onNo();
  };
}

/* =========================================================
   結果画面
   ========================================================= */
function showResult(winnerKey, isDraw){
  document.getElementById('boardScreen').classList.add('hidden');
  const title = document.getElementById('resultTitle');
  const sub = document.getElementById('resultSub');
  if(isDraw){
    title.textContent = '引き分け';
    sub.textContent = 'ライフが同じで決着はつかなかった。';
  } else if(winnerKey==='player'){
    title.textContent = 'YOU WIN!';
    sub.textContent = 'あなたの勝利です！';
  } else {
    title.textContent = 'YOU LOSE...';
    sub.textContent = 'CPUの勝利です。';
  }
  document.getElementById('resultScreen').classList.remove('hidden');
}

/* =========================================================
   ルール説明文
   ========================================================= */
const RULE_TEXT = `
<h3>概要</h3>
妖怪1504は2人用の対戦カードゲームです。全く同じ内容の15枚のデッキ（妖怪9枚＋スペル6枚）を使い、相手のライフを先に0にしたら勝利。
<h3>自分の手番でできること</h3>
毎ターン開始時に1枚ドロー。その後、好きな順で以下を行えます（フェイズを切り替える必要はありません）。<br>
<b>A.カードをプレイ</b>（手札を単タップ、または場までドラッグ）<br>
<b>B.ヒトダマを置く</b>（中央のヒトダマから自分の妖怪へドラッグ）<br>
※A・Bは合計2回まで。<br>
<b>C.解放効果を使う</b>（妖怪をタップ→メニューから。回数無制限）<br>
<b>D.スペルをセットする</b>（手札のスペルを「セット枠」へドラッグ）<br>
<b>E.攻撃する</b>（自分の妖怪を相手の妖怪までドラッグして当てる。または妖怪をタップ→「攻撃する」→対象をタップ。1手番に1回・先攻1ターン目は不可）
<h3>戦闘</h3>
相手に妖怪がいれば妖怪へ、いなければ直接攻撃。妖怪同士は攻撃力を比較し、低い方が破壊されて差分のダメージが入る。同じなら相討ち。
<h3>ターン終了</h3>
やれることがなくなると自動的にターンが終わります。いつでも自分のセットスペル枠の下にある丸い「END」ボタンで自分から終えることもできます。
<h3>操作のヒント</h3>
カードを長押しすると拡大表示できます。手札のカードは軽くタップでそのままプレイ／発動、ドラッグでセット枠に持っていくとセットになります。左上の🏠でタイトルに戻れます。
`;

/* =========================================================
   サイコロで先攻決め
   ========================================================= */
const PIP_MAP = {1:[5], 2:[1,9], 3:[1,5,9], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9]};
function diceFaceHtml(n){
  const active = new Set(PIP_MAP[n]||[5]);
  let html='';
  for(let i=1;i<=9;i++){ html += active.has(i) ? `<div class="pip"></div>` : `<div></div>`; }
  return html;
}
function setDiceFace(id, n){ document.getElementById(id).innerHTML = diceFaceHtml(n); }
function showDiceScreen(){
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('diceScreen').classList.remove('hidden');
  document.getElementById('diceResultText').textContent = '準備はいい？';
  document.getElementById('diceRollBtn').classList.remove('hidden');
  document.getElementById('diceRollBtn').disabled = false;
  document.getElementById('diceGoBtn').classList.add('hidden');
  setDiceFace('diceWhite', 1);
  setDiceFace('diceBlack', 1);
}
let diceRolling = false;
let diceAutoTimer = null;
function rollDiceOnce(){
  if(diceRolling) return;
  diceRolling = true;
  clearTimeout(diceAutoTimer);
  playSfx('tap');
  const whiteEl = document.getElementById('diceWhite');
  const blackEl = document.getElementById('diceBlack');
  whiteEl.classList.add('rolling'); blackEl.classList.add('rolling');
  document.getElementById('diceResultText').textContent = 'サイコロを転がしています…';
  document.getElementById('diceRollBtn').disabled = true;
  let ticks = 0;
  const iv = setInterval(()=>{
    setDiceFace('diceWhite', 1+Math.floor(Math.random()*6));
    setDiceFace('diceBlack', 1+Math.floor(Math.random()*6));
    ticks++;
    if(ticks>10){
      clearInterval(iv);
      whiteEl.classList.remove('rolling'); blackEl.classList.remove('rolling');
      const w = 1+Math.floor(Math.random()*6);
      const b = 1+Math.floor(Math.random()*6);
      setDiceFace('diceWhite', w);
      setDiceFace('diceBlack', b);
      playSfx('turn');
      finishDiceRoll(w,b);
    }
  }, 80);
}
function finishDiceRoll(w,b){
  diceRolling = false;
  document.getElementById('diceRollBtn').disabled = false;
  const resultEl = document.getElementById('diceResultText');
  if(w===b){
    resultEl.textContent = `${w} と ${b} で同じ目！ もう一度振ります…`;
    diceAutoTimer = setTimeout(()=>rollDiceOnce(), 1100);
    return;
  }
  const winner = w>b ? 'player' : 'cpu';
  resultEl.textContent = w>b ? `あなたの ${w} の勝ち！ あなたが先攻です。` : `CPUの ${b} の勝ち！ CPUが先攻です。`;
  document.getElementById('diceRollBtn').classList.add('hidden');
  const goBtn = document.getElementById('diceGoBtn');
  goBtn.classList.remove('hidden');
  goBtn.onclick = ()=>{ clearTimeout(diceAutoTimer); playSfx('tap'); newGame(winner); };
  diceAutoTimer = setTimeout(()=>{ newGame(winner); }, 1800);
}

/* =========================================================
   起動
   ========================================================= */
document.getElementById('startBtn').onclick = ()=>{ playSfx('tap'); showDiceScreen(); };
document.getElementById('diceRollBtn').onclick = ()=>{ rollDiceOnce(); };
document.getElementById('endTurnBtn').onclick = ()=>{
  if(!state || state.gameOver || state.active!=='player') return;
  playSfx('tap');
  // 強制的にペンディング状態を解除してから終了する（何が起きても必ず進むように）
  if(state.pendingAttacker){ state.pendingAttacker = null; }
  if(state.selection){
    const sel = state.selection;
    state.selection = null;
    if(sel.onCancel){ try{ sel.onCancel(); }catch(e){ console.error(e); } }
  }
  hideToast();
  endTurn();
};
document.getElementById('showRuleBtn').onclick = ()=>{
  const box = document.getElementById('ruleBox');
  if(box.classList.contains('hidden')){ box.innerHTML = RULE_TEXT; box.classList.remove('hidden'); }
  else box.classList.add('hidden');
};
document.getElementById('soundToggle').onchange = (e)=>{ soundOn = e.target.checked; };
document.getElementById('soundBtn').onclick = ()=>{
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  if(soundOn) playSfx('tap');
};
document.getElementById('helpBtn').onclick = ()=>{
  const box = document.getElementById('detailCard');
  box.innerHTML = `<div class="ddesc" style="text-align:left; background:#fff; padding:14px; border-radius:12px; font-size:12.5px; line-height:1.6;">${RULE_TEXT}</div><button id="detailClose">閉じる</button>`;
  document.getElementById('detailOverlay').classList.remove('hidden');
  document.getElementById('detailClose').onclick = ()=>document.getElementById('detailOverlay').classList.add('hidden');
};
document.getElementById('retryBtn').onclick = ()=>{ playSfx('tap'); showDiceScreen(); };
document.getElementById('homeBtn').onclick = ()=>{
  playSfx('tap');
  if(!state || state.gameOver){
    document.getElementById('boardScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.add('hidden');
    document.getElementById('setupScreen').classList.remove('hidden');
    return;
  }
  showConfirm('対戦を中断してタイトルに戻りますか？', ()=>{
    if(state) state.gameOver = true; // 進行中のsetTimeoutチェーンを安全に止める
    document.getElementById('boardScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.add('hidden');
    document.getElementById('setupScreen').classList.remove('hidden');
  });
};

</script>
